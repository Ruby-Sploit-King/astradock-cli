[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "astradock-cli"
version = "1.0.0"
description = "A neon terminal catalog for local development workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ruby-Sploit-King" }]
keywords = ["cli", "workspace", "catalog", "projects", "terminal", "rich", "typer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Ruby-Sploit-King/astradock-cli"
Repository = "https://github.com/Ruby-Sploit-King/astradock-cli"
Issues = "https://github.com/Ruby-Sploit-King/astradock-cli/issues"
Changelog = "https://github.com/Ruby-Sploit-King/astradock-cli/releases"

[project.scripts]
AstraDock = "main:app"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "astradock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
